<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3 Lab 5 – Data Pipeline Visualizations</title>
<style>
body{font-family:sans-serif;margin:20px;}
.tabs button{padding:8px 16px;border:1px solid #ccc;background:#f4f4f4;cursor:pointer;font-size:14px;border-radius:4px 4px 0 0}
.tabs button.active{background:#4C78A8;color:#fff;border-color:#4C78A8}
.panel{display:none;padding-top:12px} .panel.active{display:block}
</style>
</head>
<body>
<h2>D3.js Lab 5 – Data Pipeline Visualizations</h2>
<div class="tabs">
  <button class="active" data-tab="force">Force-Directed Graph</button>
  <button data-tab="sankey">Sankey Diagram</button>
  <button data-tab="treemap">Treemap</button>
</div>
<div id="force" class="panel active"><div id="g-force" style="position:relative;display:inline-block"></div></div>
<div id="sankey" class="panel"><div id="g-sankey" style="position:relative;display:inline-block"></div></div>
<div id="treemap" class="panel"><div id="g-treemap" style="position:relative;display:inline-block"></div></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12/dist/d3-sankey.min.js"></script>
<script>

function drawForce(sel) {
  const width = 800, height = 480;
  // 7 pipeline stages (nodes) and the connections between them (links)
  const nodes = [
    {id: "Data Cleaning"}, {id: "EDA"}, {id: "Feature Engineering"},
    {id: "Model Training"}, {id: "Evaluation"}, {id: "Visualization"}, {id: "Deployment"}
  ];
  const links = [
    {source: "Data Cleaning", target: "EDA"},
    {source: "EDA", target: "Feature Engineering"},
    {source: "Feature Engineering", target: "Model Training"},
    {source: "Model Training", target: "Evaluation"},
    {source: "Evaluation", target: "Visualization"},
    {source: "Visualization", target: "Deployment"},
    {source: "EDA", target: "Visualization"}
  ];
  const baseColor = "#4C78A8", hoverColor = "#F58518";

  const svg = d3.select(sel).append("svg")
    .attr("width", width).attr("height", height)
    .style("border", "1px solid #ccc").style("background", "#fff");

  // Force simulation: links pull connected nodes together, charge pushes all nodes apart
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(110))
    .force("charge", d3.forceManyBody().strength(-320))
    .force("center", d3.forceCenter(width / 2, height / 2));

  const link = svg.append("g").selectAll("line").data(links).join("line")
    .attr("stroke", "#999").attr("stroke-width", 1.5);

  const node = svg.append("g").selectAll("circle").data(nodes).join("circle")
    .attr("r", 10).attr("fill", baseColor).style("cursor", "grab")
    // Hover effect: smooth colour + size change, and highlight connected links
    .on("mouseover", function (event, d) {
      d3.select(this).transition().duration(200).attr("fill", hoverColor).attr("r", 15);
      link.attr("stroke", l => (l.source === d || l.target === d) ? hoverColor : "#999")
          .attr("stroke-width", l => (l.source === d || l.target === d) ? 3 : 1.5);
    })
    .on("mouseout", function () {
      d3.select(this).transition().duration(200).attr("fill", baseColor).attr("r", 10);
      link.attr("stroke", "#999").attr("stroke-width", 1.5);
    })
    // Dragging: pin the node to the mouse (fx, fy) while dragging, release on end
    .call(d3.drag()
      .on("start", (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on("end",   (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));
  node.append("title").text(d => d.id);

  const label = svg.append("g").selectAll("text").data(nodes).join("text")
    .text(d => d.id).attr("font-size", 12).attr("dx", 16).attr("dy", 4)
    .style("pointer-events", "none").attr("font-family", "sans-serif");

  // On every tick, copy the simulation's positions onto the SVG elements
  simulation.on("tick", () => {
    nodes.forEach(d => {   // keep nodes inside the SVG box
      d.x = Math.max(15, Math.min(width - 15, d.x));
      d.y = Math.max(15, Math.min(height - 15, d.y));
    });
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("cx", d => d.x).attr("cy", d => d.y);
    label.attr("x", d => d.x).attr("y", d => d.y);
  });
}


function drawSankey(sel) {
  const width = 900, height = 450;
  const nodes = [
    {name: "Web Logs"}, {name: "Mobile App"}, {name: "CRM Export"},
    {name: "Data Cleaning"}, {name: "Rejected"}, {name: "EDA"},
    {name: "Feature Engineering"}, {name: "Model Training"},
    {name: "Evaluation"}, {name: "Visualization"}, {name: "Deployment"}
  ];
  const links = [
    {source: "Web Logs", target: "Data Cleaning", value: 5000},
    {source: "Mobile App", target: "Data Cleaning", value: 3000},
    {source: "CRM Export", target: "Data Cleaning", value: 2000},
    {source: "Data Cleaning", target: "EDA", value: 8500},
    {source: "Data Cleaning", target: "Rejected", value: 1500},
    {source: "EDA", target: "Feature Engineering", value: 6000},
    {source: "EDA", target: "Visualization", value: 2500},
    {source: "Feature Engineering", target: "Model Training", value: 4800},
    {source: "Feature Engineering", target: "Evaluation", value: 1200},
    {source: "Model Training", target: "Evaluation", value: 4800},
    {source: "Evaluation", target: "Deployment", value: 5000},
    {source: "Evaluation", target: "Visualization", value: 1000}
  ];
  const svg = d3.select(sel).append("svg")
    .attr("width", width).attr("height", height)
    .style("border", "1px solid #ccc").style("background", "#fff");

  // d3.sankey() computes node positions and link thicknesses from the flow values
  const graph = d3.sankey()
    .nodeId(d => d.name).nodeWidth(16).nodePadding(20)
    .extent([[10, 10], [width - 10, height - 10]])
    ({nodes: nodes.map(d => ({...d})), links: links.map(d => ({...d}))});
  const color = d3.scaleOrdinal(d3.schemeTableau10);
  const fmt = d3.format(",");

  svg.append("g").selectAll("path").data(graph.links).join("path")
    .attr("d", d3.sankeyLinkHorizontal()).attr("fill", "none")
    .attr("stroke", d => color(d.source.name))
    .attr("stroke-opacity", 0.4).attr("stroke-width", d => Math.max(1, d.width))
    .append("title").text(d => `${d.source.name} → ${d.target.name}: ${fmt(d.value)} records`);

  const node = svg.append("g").selectAll("rect").data(graph.nodes).join("rect")
    .attr("x", d => d.x0).attr("y", d => d.y0)
    .attr("width", d => d.x1 - d.x0).attr("height", d => d.y1 - d.y0)
    .attr("fill", d => color(d.name))
    // Hover transition: node colour fades to a brighter shade over 200 ms
    .on("mouseover", function (event, d) {
      d3.select(this).transition().duration(200).attr("fill", d3.color(color(d.name)).brighter(0.7));
    })
    .on("mouseout", function (event, d) {
      d3.select(this).transition().duration(200).attr("fill", color(d.name));
    });
  node.append("title").text(d => `${d.name}: ${fmt(d.value)} records`);

  svg.append("g").selectAll("text").data(graph.nodes).join("text")
    .text(d => d.name).attr("font-size", 11).attr("font-family", "sans-serif")
    .attr("x", d => d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6)
    .attr("y", d => (d.y0 + d.y1) / 2).attr("dy", "0.35em")
    .attr("text-anchor", d => d.x0 < width / 2 ? "start" : "end");
}


function drawTreemap(sel) {
  const width = 900, height = 480;
  // Hierarchical data: Pipeline -> category (input source / processing stage) -> leaf (records)
  const data = {
    name: "Pipeline Data Volume",
    children: [
      {name: "Input Sources", children: [
        {name: "Web Logs", value: 5000}, {name: "Mobile App", value: 3000}, {name: "CRM Export", value: 2000}
      ]},
      {name: "Processing Stages", children: [
        {name: "Data Cleaning", value: 8500}, {name: "EDA", value: 8500},
        {name: "Feature Engineering", value: 6000}, {name: "Model Training", value: 4800},
        {name: "Evaluation", value: 6000}, {name: "Visualization", value: 3500},
        {name: "Deployment", value: 5000}, {name: "Rejected Records", value: 1500}
      ]}
    ]
  };
  const fmt = d3.format(",");
  const color = d3.scaleOrdinal().domain(["Input Sources", "Processing Stages"]).range(["#E45756", "#4C78A8"]);

  // 1) d3.hierarchy structures the data and .sum() adds up leaf values for parents
  const root = d3.hierarchy(data).sum(d => d.value).sort((a, b) => b.value - a.value);
  // 2) d3.treemap() calculates x0,y0,x1,y1 for every node (paddingTop leaves room for group titles)
  d3.treemap().size([width, height]).paddingOuter(4).paddingTop(22).paddingInner(2).round(true)(root);

  const svg = d3.select(sel).append("svg")
    .attr("width", width).attr("height", height)
    .style("border", "1px solid #ccc").style("background", "#fff");

  // Tooltip div
  const tip = d3.select(sel).append("div")
    .style("position", "absolute").style("pointer-events", "none").style("opacity", 0)
    .style("background", "#222").style("color", "#fff").style("padding", "6px 10px")
    .style("border-radius", "4px").style("font", "12px sans-serif");

  // Category (level 1) rectangles with titles
  const groups = svg.selectAll("g.group").data(root.children).join("g").attr("class", "group");
  groups.append("rect")
    .attr("x", d => d.x0).attr("y", d => d.y0).attr("width", d => d.x1 - d.x0).attr("height", d => d.y1 - d.y0)
    .attr("fill", d => color(d.data.name)).attr("fill-opacity", 0.12)
    .attr("stroke", d => color(d.data.name));
  groups.append("text").attr("x", d => d.x0 + 6).attr("y", d => d.y0 + 15)
    .text(d => `${d.data.name} (${fmt(d.value)})`)
    .attr("font-family", "sans-serif").attr("font-size", 13).attr("font-weight", "bold").attr("fill", d => color(d.data.name));

  // Leaf rectangles coloured by category
  const leaf = svg.selectAll("g.leaf").data(root.leaves()).join("g").attr("class", "leaf")
    .attr("transform", d => `translate(${d.x0},${d.y0})`);
  leaf.append("rect")
    .attr("width", d => d.x1 - d.x0).attr("height", d => d.y1 - d.y0)
    .attr("fill", d => color(d.parent.data.name)).attr("stroke", "#fff")
    .on("mouseover", function (event, d) {
      d3.select(this).transition().duration(200)
        .attr("fill", d3.color(color(d.parent.data.name)).brighter(0.7)).attr("stroke", "#222").attr("stroke-width", 2);
      tip.style("opacity", 1).html(`<b>${d.data.name}</b><br>${fmt(d.value)} records<br>${(100 * d.value / root.value).toFixed(1)}% of total`);
    })
    .on("mousemove", function (event) {
      const [x, y] = d3.pointer(event, svg.node().parentNode);
      tip.style("left", (x + 14) + "px").style("top", (y + 14) + "px");
    })
    .on("mouseout", function (event, d) {
      d3.select(this).transition().duration(200).attr("fill", color(d.parent.data.name)).attr("stroke", "#fff").attr("stroke-width", 1);
      tip.style("opacity", 0);
    });
  // Labels (wrap onto two lines: name + value) - clipped to the rectangle
  leaf.append("clipPath").attr("id", (d, i) => `clip-${sel.slice(1)}-${i}`)
    .append("rect").attr("width", d => d.x1 - d.x0).attr("height", d => d.y1 - d.y0);
  leaf.append("text").attr("clip-path", (d, i) => `url(#clip-${sel.slice(1)}-${i})`)
    .style("pointer-events", "none").attr("font-family", "sans-serif").attr("fill", "#fff").attr("font-size", 12)
    .selectAll("tspan").data(d => [d.data.name, fmt(d.value)]).join("tspan")
    .attr("x", 6).attr("y", (d, i) => 17 + i * 15).attr("font-weight", (d, i) => i === 0 ? "bold" : "normal").text(d => d);
}

const drawn = {};
const draw = {force: () => drawForce("#g-force"), sankey: () => drawSankey("#g-sankey"), treemap: () => drawTreemap("#g-treemap")};
function show(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === name));
  if (!drawn[name]) { draw[name](); drawn[name] = true; }   // draw each chart once, on first visit
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.tab));
(function wait() { if (window.d3 && window.d3.sankey) show("force"); else setTimeout(wait, 50); })();
</script>
</body>
</html>
