<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3 Force-Directed Graph – Data Pipeline</title>
<style>body{font-family:sans-serif;margin:20px;} h2{margin-bottom:4px} p.sub{margin-top:0;color:#555}</style>
</head>
<body>
<h2>Data Pipeline – Force-Directed Graph</h2>
<p class="sub">Drag any node. Hover to highlight its connections.</p><div id="graph" style="position:relative;display:inline-block"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>

function drawForce(sel) {
  const width = 800, height = 480;
  // 7 pipeline stages (nodes) and the connections between them (links)
  const nodes = [
    {id: "Data Cleaning"}, {id: "EDA"}, {id: "Feature Engineering"},
    {id: "Model Training"}, {id: "Evaluation"}, {id: "Visualization"}, {id: "Deployment"}
  ];
  const links = [
    {source: "Data Cleaning", target: "EDA"},
    {source: "EDA", target: "Feature Engineering"},
    {source: "Feature Engineering", target: "Model Training"},
    {source: "Model Training", target: "Evaluation"},
    {source: "Evaluation", target: "Visualization"},
    {source: "Visualization", target: "Deployment"},
    {source: "EDA", target: "Visualization"}
  ];
  const baseColor = "#4C78A8", hoverColor = "#F58518";

  const svg = d3.select(sel).append("svg")
    .attr("width", width).attr("height", height)
    .style("border", "1px solid #ccc").style("background", "#fff");

  // Force simulation: links pull connected nodes together, charge pushes all nodes apart
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(110))
    .force("charge", d3.forceManyBody().strength(-320))
    .force("center", d3.forceCenter(width / 2, height / 2));

  const link = svg.append("g").selectAll("line").data(links).join("line")
    .attr("stroke", "#999").attr("stroke-width", 1.5);

  const node = svg.append("g").selectAll("circle").data(nodes).join("circle")
    .attr("r", 10).attr("fill", baseColor).style("cursor", "grab")
    // Hover effect: smooth colour + size change, and highlight connected links
    .on("mouseover", function (event, d) {
      d3.select(this).transition().duration(200).attr("fill", hoverColor).attr("r", 15);
      link.attr("stroke", l => (l.source === d || l.target === d) ? hoverColor : "#999")
          .attr("stroke-width", l => (l.source === d || l.target === d) ? 3 : 1.5);
    })
    .on("mouseout", function () {
      d3.select(this).transition().duration(200).attr("fill", baseColor).attr("r", 10);
      link.attr("stroke", "#999").attr("stroke-width", 1.5);
    })
    // Dragging: pin the node to the mouse (fx, fy) while dragging, release on end
    .call(d3.drag()
      .on("start", (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on("end",   (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));
  node.append("title").text(d => d.id);

  const label = svg.append("g").selectAll("text").data(nodes).join("text")
    .text(d => d.id).attr("font-size", 12).attr("dx", 16).attr("dy", 4)
    .style("pointer-events", "none").attr("font-family", "sans-serif");

  // On every tick, copy the simulation's positions onto the SVG elements
  simulation.on("tick", () => {
    nodes.forEach(d => {   // keep nodes inside the SVG box
      d.x = Math.max(15, Math.min(width - 15, d.x));
      d.y = Math.max(15, Math.min(height - 15, d.y));
    });
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("cx", d => d.x).attr("cy", d => d.y);
    label.attr("x", d => d.x).attr("y", d => d.y);
  });
}

(function wait() {
  if (window.d3) drawForce("#graph"); else setTimeout(wait, 50);
})();
</script>
</body>
</html>
